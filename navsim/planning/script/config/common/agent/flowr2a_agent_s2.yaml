_target_: navsim.agents.flowr2a.flowr2a_agent.TransfuserAgent
_convert_: 'all'

config:
  _target_: navsim.agents.flowr2a.flowr2a_config.TransfuserConfig
  _convert_: 'all'

  trajectory_sampling:
    _target_: nuplan.planning.simulation.trajectory.trajectory_sampling.TrajectorySampling
    _convert_: 'all'
    time_horizon: 4
    interval_length: 0.5

  latent: False

  # Stage-2 (scorer-only) overrides on top of the shared flowr2a_config defaults.
  area_pred: True
  ttc_time_pred: True
  scorer_only: True
  num_scorer_traj_sample: 32
  checkpoint_path: /path/to/stage1_checkpoint.ckpt  # stage-1 (flowr2a_agent_s1) weights to load

checkpoint_path: null
lr: 3e-4
